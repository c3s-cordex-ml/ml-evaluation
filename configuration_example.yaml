# ==============================================================================
# ML Evaluation Pipeline Configuration Example
# ==============================================================================
# Use this configuration file with the CLI:
#   pixi run -e dev python ml_evaluation/cli.py --config configuration_example.yaml
#
# Schema Details:
# - The top-level key must be 'evaluations'.
# - Each item under 'evaluations' represents a sequential evaluation task.
# ==============================================================================

evaluations:

  # ----------------------------------------------------------------------------
  # 1. Fast-Track Evaluation ('fast')
  # ----------------------------------------------------------------------------
- type: "fast"
  x0: "tests/data/ref.nc"                    # Path to the reference ground truth dataset
  x1: "tests/data/pred.nc"                   # Path to the prediction dataset
  var: "tasmax"                              # Name of the variable to analyze
  output: "outputs/fast_evaluation"          # Prefix path where output Zarr stores are written

    # Optional parameters:
  seasons: ["DJF", "MAM"]                    # Can be a single string or a list of seasons/months
  align_leap_days: "fill"                    # Method for leap-year alignment: "fill", "drop", or None (default: "fill")
  force_load: true                           # Force loading of datasets into memory before evaluation (default: true)
  use_dask: false                            # Use Dask for computation (default: false)

  # ----------------------------------------------------------------------------
  # 2. Slow-Track Evaluation ('slow')
  # ----------------------------------------------------------------------------
- type: "slow"
  x0: "tests/data/ref.nc"
  x1: "tests/data/pred.nc"
  var: "tasmax"
  output: "outputs/slow_evaluation"

    # Optional parameters:
  seasons: ["JJA"]                           # Single season/month or list of seasons/months (default: None)
  align_leap_days: "fill"                    # Method for leap-year alignment (default: "fill")
  force_load: true                           # Force loading of datasets into memory (default: true)
  use_dask: true                             # Enable parallelized computation with Dask

  # ----------------------------------------------------------------------------
  # 3. Multi-Variable Evaluation ('multivar')
  # ----------------------------------------------------------------------------
- type: "multivar"
  x0: "tests/data/ref_mv.nc"
  x1: "tests/data/pred_mv.nc"
  vars: ["tasmax", "tasmin"]                 # Must be a list containing exactly two variables
  output: "outputs/multivar_evaluation"

    # Optional parameters:
  seasons: "DJF"                             # Can specify as a single string
  use_dask: false                            # (default: false)

  # ----------------------------------------------------------------------------
  # 4. Calendar Day Quantiles Calculation ('cdquantiles')
  # ----------------------------------------------------------------------------
- type: "cdquantiles"
  x0: "tests/data/ref.nc"
  var: "tasmax"
  output: "outputs/thresholds"               # Directory where output threshold netCDF files are saved

    # Optional parameters:
  use_dask: true                             # (default: false)

  # ----------------------------------------------------------------------------
  # 5. Calendar Day Extremes Evaluation ('cdextremes')
  # ----------------------------------------------------------------------------
- type: "cdextremes"
  x0: "tests/data/ref.nc"
  x1: "tests/data/pred.nc"
  var: "tasmax"
  thresh_dir: "outputs/thresholds"           # Directory containing thresholds generated by 'cdquantiles'
  output: "outputs/cdextremes_evaluation"

    # Optional parameters:
  seasons: ["DJF", "MAM", "JJA", "SON"]      # Can run over all seasons sequentially
  use_dask: true                             # (default: false)
