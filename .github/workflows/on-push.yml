name: on-push

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
        environments: dev
    - name: Run QA check
      run: |
        pixi run -e dev qa


  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
        environments: dev
    - name: Run tests
      run: |
        pixi run -e dev unit-tests
