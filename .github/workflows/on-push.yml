name: on-push

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: 3.x
    - uses: pre-commit/action@v3.0.1

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
        environments: dev
    - name: Run tests
      run: |
        pixi run -e dev unit-tests

  type-check:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
        environments: dev
    - name: Run type checking
      run: |
        pixi run -e dev type-check

  docs-build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
        environments: dev
    - name: Build documentation
      run: |
        pixi run -e dev docs-build

  distribution:
    runs-on: ubuntu-latest
    needs: [unit-tests, type-check, docs-build]
    if: |
      always() &&
      needs.unit-tests.result == 'success' &&
      needs.type-check.result == 'success' &&
      needs.docs-build.result == 'success'

    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
        environments: dev
    - name: Build distribution
      run: |
        pixi run -e dev python -m build
    - name: Check wheels
      run: |
        cd dist || exit
        pixi run -e dev pip install ml_evaluation-*.whl || exit
        pixi run -e dev twine check --strict * || exit
        pixi run -e dev python -c "import ml_evaluation" || exit
        cd ..
    - uses: actions/upload-artifact@v7
      with:
        name: distribution
        path: dist

  upload-to-pypi:
    runs-on: ubuntu-latest
    needs: distribution
    if: |
      always() &&
      needs.distribution.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags')
    environment:
      name: pypi
      url: https://pypi.org/p/ml-evaluation
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: distribution
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        verbose: true
